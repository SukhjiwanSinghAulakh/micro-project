apiVersion: v1
kind: Pod
metadata:
  name: pgadmin
  labels:
    app.kubernetes.io/name: pgadmin
spec:
  containers:
  - name: pgadmin
    image: elestio/pgadmin
    ports:
      - containerPort: 803
    env:
      - name: PGADMIN_DEFAULT_EMAIL
        value: admin@example.com

      - name: PGADMIN_DEFAULT_PASSWORD
        value: admin123  
