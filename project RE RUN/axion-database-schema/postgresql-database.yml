apiVersion: v1
kind: Pod
metadata:
  name: postgresql
  labels:
    app: postgresql
spec:
  containers:
  - name: postgresql
    image: postgres:latest
  
    ports:
      - containerPort: 5432

    env:
      - name: POSTGRES_USER
        value: "myuser"
      - name: POSTGRES_PASSWORD
        value: "mypassword"
      - name: POSTGRES_DB
        value: "mydatabase"  
